services:
    bingo:
        image: ghcr.io/v4ldum/bingo:latest
        restart: unless-stopped
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        tmpfs:
            - /tmp:mode=0700,uid=101,gid=101
        healthcheck:
            # Draining
            test: test ! -f /tmp/drain # && some other healthcheck
            interval: 5s
            retries: 1
        networks:
            - netv6
        environment:
            - TZ=Europe/Paris
        labels:
            traefik.enable: true
            traefik.http.routers.bingo.tls: true
            traefik.http.routers.bingo.entrypoints: websecure
            traefik.http.routers.bingo.rule: Host(`bingo.valdum.dev`)

networks:
    netv6:
        name: netv6
        external: true
